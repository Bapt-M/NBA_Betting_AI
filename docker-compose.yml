services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nba_user
      - POSTGRES_PASSWORD=nba_password
      - POSTGRES_DB=nba_betting_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba_user -d nba_betting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # CORRECTION COMMANDE : backend.main
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always
    volumes:
      # CORRECTION VOLUME : On mappe dans /app/backend
      - ./backend:/app/backend
      - ./src:/app/src
      - ./daily:/app/daily
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nba_user:nba_password@db/nba_betting_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      # Ajout du PYTHONPATH pour que Python trouve les modules à la racine
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # CORRECTION COMMANDE : backend.celery_worker
    command: celery -A backend.celery_worker.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ./backend:/app/backend
      - ./src:/app/src
      - ./daily:/app/daily
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=postgresql://nba_user:nba_password@db/nba_betting_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      - backend
      - redis

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # CORRECTION COMMANDE : backend.celery_worker
    command: celery -A backend.celery_worker.celery_app beat --loglevel=info
    restart: always
    volumes:
      - ./backend:/app/backend
    environment:
      - PYTHONPATH=/app
    depends_on:
      - worker

volumes:
  postgres_data: