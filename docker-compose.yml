services:
  # Base de données (PostgreSQL)
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=nba_user
      - POSTGRES_PASSWORD=nba_password
      - POSTGRES_DB=nba_betting_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba_user -d nba_betting_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Broker de tâches (Redis)
  redis:
    image: redis:7

  # Backend API (FastAPI)
  backend:
    build:
      context: .             # <--- IMPORTANT : On construit depuis la racine
      dockerfile: backend/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    restart: always          # <--- IMPORTANT : Relance le container s'il crash (attente DB)
    volumes:
      - ./backend:/app       # Code du backend
      - ./src:/app/src       # Scripts de calcul partagés
      - ./daily:/app/daily   # Scripts quotidiens partagés
      - ./data:/app/data     # Données CSV/JSON
      - ./models:/app/models # Modèles IA
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nba_user:nba_password@db/nba_betting_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy # Attend que la DB soit vraiment prête
      redis:
        condition: service_started

  # Worker Celery
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A celery_worker.celery_app worker --loglevel=info
    restart: always
    volumes:
      - ./backend:/app
      - ./src:/app/src
      - ./daily:/app/daily
      - ./data:/app/data
      - ./models:/app/models
    environment:
      - DATABASE_URL=postgresql://nba_user:nba_password@db/nba_betting_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  # Scheduler Celery Beat
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A celery_worker.celery_app beat --loglevel=info
    restart: always
    volumes:
      - ./backend:/app
    depends_on:
      - worker

volumes:
  postgres_data: